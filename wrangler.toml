# Cloudflare Pages configuration
# https://developers.cloudflare.com/pages/

name = 'scribbles'
compatibility_date = "2026-04-10"
workers_dev = false
preview_urls = false
main = "./worker/index.js"

[assets]
directory = "public"
html_handling = "none"
binding = "ASSETS"
run_worker_first = ["/", "/*.html", "/activitypub/*"]
not_found_handling = "404-page"

# ActivityPub follower store (see worker/activitypub.js)
[[kv_namespaces]]
binding = "AP"
id = "1f9183530e704cc4bd379490b69d70bf"

# Deliver new posts to followers
[triggers]
crons = ["*/30 * * * *"]

[build]
command = "hugo"

[build.environment]
HUGO_VERSION = "0.164.0"
